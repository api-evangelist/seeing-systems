name: Seeing Systems
description: >-
  Seeing Systems is a Y Combinator (Winter 2026) defense technology company
  building autonomous, modular strike drones and AI-powered swarm coordination
  software at the intersection of artificial intelligence and robotics. Its
  product line includes Bandit, a cost-effective FPV drone for training and
  expendable missions with 30+ km of range; Banshee, an autonomous modular
  platform built for contested, jamming-resistant environments with 40+ km of
  range; and Aerie AI, swarm coordination software for multi-platform
  operations that lowers operator cognitive load. The company works directly
  with military and defense partners — including UK Royal Marine Commandos and
  NATO forces — rather than publishing a public developer platform. This
  profile is maintained in the API Evangelist network; as of the latest
  enrichment pass Seeing Systems exposes no public API, SDK, developer portal,
  or documentation surface.
